name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Two jobs, not two steps: each suite gets its own emulator process. Sharing
  # one meant the UI run started against an emulator the rules suite had just
  # saturated, and its auth calls occasionally stalled — a failure that said
  # nothing about the code.
  rules:
    name: Security rules (76)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The Firestore emulator is a Java program; without a JDK nothing runs.
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run test:rules
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rules-emulator-logs
          path: |
            firestore-debug.log
            firebase-debug.log
          retention-days: 7

  ui:
    name: UI (17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # emulators:exec owns the emulator lifecycle and Playwright owns the dev
      # server, so this one command is the whole run — nothing to start by hand,
      # and nothing left holding a port when it ends.
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
