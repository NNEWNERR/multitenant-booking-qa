name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Two jobs, not two steps: each suite gets its own emulator process. Sharing
  # one meant the UI run started against an emulator the rules suite had just
  # saturated, and its auth calls occasionally stalled — a failure that said
  # nothing about the code.
  rules:
    name: Security rules (76)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC token for the Firestore stats step
    steps:
      - uses: actions/checkout@v7
      # The Firestore emulator is a Java program; without a JDK nothing runs.
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run test:rules
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rules-emulator-logs
          path: |
            firestore-debug.log
            firebase-debug.log
          retention-days: 7
      - name: Authenticate to portfolio Firestore
        # Keyless: GitHub OIDC -> Workload Identity Federation. Only pushes to
        # main in NNEWNERR repos can mint this token.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/932862873750/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: ci-stats-writer@supakorn-portfolio.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Publish test stats to nnewnerr.github.io
        # Runs on red builds too — the portfolio shows the latest result, not
        # the latest green one. Never fails the build on its own.
        if: always() && steps.gcp.outcome == 'success'
        continue-on-error: true
        env:
          FIRESTORE_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: node scripts/publish-test-stats.mjs --suite mtb-rules --repo multitenant-booking-qa --label "Firestore rules · Vitest" --kind vitest --file vitest-results.json

  ui:
    name: UI (17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # OIDC token for the Firestore stats step
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # emulators:exec owns the emulator lifecycle and Playwright owns the dev
      # server, so this one command is the whole run — nothing to start by hand,
      # and nothing left holding a port when it ends.
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Authenticate to portfolio Firestore
        # Keyless: GitHub OIDC -> Workload Identity Federation. Only pushes to
        # main in NNEWNERR repos can mint this token.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/932862873750/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: ci-stats-writer@supakorn-portfolio.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Publish test stats to nnewnerr.github.io
        # Runs on red builds too — the portfolio shows the latest result, not
        # the latest green one. Never fails the build on its own.
        if: always() && steps.gcp.outcome == 'success'
        continue-on-error: true
        env:
          FIRESTORE_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: node scripts/publish-test-stats.mjs --suite mtb-ui --repo multitenant-booking-qa --label "UI · Playwright" --kind playwright --file results.json
