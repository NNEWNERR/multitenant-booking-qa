name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Two jobs, not two steps: each suite gets its own emulator process. Sharing
  # one meant the UI run started against an emulator the rules suite had just
  # saturated, and its auth calls occasionally stalled — a failure that said
  # nothing about the code.
  rules:
    name: Security rules (76)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The Firestore emulator is a Java program; without a JDK nothing runs.
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run test:rules
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rules-emulator-logs
          path: |
            firestore-debug.log
            firebase-debug.log
          retention-days: 7
      - name: Keep totals for the stats job
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: stats-rules
          path: vitest-results.json
          if-no-files-found: ignore
          retention-days: 1

  ui:
    name: UI (17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # emulators:exec owns the emulator lifecycle and Playwright owns the dev
      # server, so this one command is the whole run — nothing to start by hand,
      # and nothing left holding a port when it ends.
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Keep totals for the stats job
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: stats-ui
          path: results.json
          if-no-files-found: ignore
          retention-days: 1

  # The only job that can mint the stats token. It never runs `npm ci` or any
  # repo code besides the dependency-free publish script, so a compromised
  # package elsewhere in the pipeline cannot request the OIDC token.
  publish-stats:
    name: Publish test stats
    needs: [rules, ui]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write   # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/publish-test-stats.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: actions/download-artifact@v8
        with: { pattern: stats-*, path: stats }
      - name: Authenticate to portfolio Firestore
        # Keyless: GitHub OIDC -> Workload Identity Federation. Only pushes to
        # main in NNEWNERR repos can mint this token.
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/932862873750/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: ci-stats-writer@supakorn-portfolio.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      # Runs on red builds too — the portfolio shows the latest result, not the
      # latest green one. Each suite publishes on its own, so one missing report
      # doesn't hide the other.
      - name: Publish rules stats
        if: always() && steps.gcp.outcome == 'success' && hashFiles('stats/stats-rules/vitest-results.json') != ''
        env:
          FIRESTORE_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: node scripts/publish-test-stats.mjs --suite mtb-rules --repo multitenant-booking-qa --label "Firestore rules · Vitest" --kind vitest --file stats/stats-rules/vitest-results.json
      - name: Publish UI stats
        if: always() && steps.gcp.outcome == 'success' && hashFiles('stats/stats-ui/results.json') != ''
        env:
          FIRESTORE_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: node scripts/publish-test-stats.mjs --suite mtb-ui --repo multitenant-booking-qa --label "UI · Playwright" --kind playwright --file stats/stats-ui/results.json
